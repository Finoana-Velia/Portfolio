<section class="flex justify-center items-center max-h-screen px-10 pt-5 mb-10" id="skills">
    <div class="relative bg-sky-900 p-5 rounded-2xl z-50 w-full text-center" data-aos="fade-up">
         <h2 class="text-white text-3xl font-bold">{{ 'SKILLS' | translate}}</h2>
        <swiper-container 
            #swiperEl 
            class="w-full px-2 py-10"
            >
            <swiper-slide *ngFor="let tech of techs">
                <div class="flex flex-col justify-center items-center gap-5">
                    <div class="w-30 h-30">
                        <img [src]="tech.logo" [alt]="tech.logo" class="w-full h-full object-cover object-center">
                    </div>
                    <p class="text-white font-semibold text-xl">{{tech.title}}</p>
                </div>
            </swiper-slide>
        </swiper-container>
    </div>
</section>

<section class="relative bg-black z-50 p-10 min-h-screen" id="projects">
    <div class="flex flex-col justify-center items-center w-full"> 
         <h2 class="text-white text-3xl font-bold opacity-100">{{ 'PROJECTS' | translate }}</h2>
        <div class="flex justify-center items-center gap-5 flex-wrap my-5">
            @for (project of projects; track $index) {
                <div 
                    class="flex justify-center items-center w-[300px] h-[150px] rounded-xl cursor-pointer card" 
                    (click)="selectProject(project)"
                    data-aos="fade-up"
                    [attr.data-title]="project.title"
                >
                    <!-- <p>{{project.title}}</p> -->
                    <img [src]="project.background" [alt]="project.background" class="w-full h-full object-center object-cover rounded-xl">
                </div>
            }
        </div>
        @if(projectSelected) {
            <div class="relative flex w-full bg-sky-950 rounded-xl gap-5 px-5 py-10 my-5 max-lg:flex-col" data-aos="fade-right">
                <div class="flex justify-center items-center w-[300px] h-[200px] rounded-xl max-lg:w-[100%] max-lg:h-[20%]">
                    <!-- <p>{{projectSelected.title}}</p> -->
                    <img [src]="projectSelected.monitor" [alt]="projectSelected.monitor">
                </div>
                <div class="flex items-center flex-col gap-5 w-2/3 max-lg:w-full">
                    <h4 class="text-2xl text-white w-full">
                        <!-- <strong>Project :</strong>  -->
                         <strong>Projet :</strong> 
                        {{projectSelected.title}}
                    </h4>
                    <p class="text-white w-full">
                        <strong>Description : </strong> {{projectSelected.description | translate}}
                    </p>
                    
                        <div class="flex justify-between w-full max-md:flex-col">
                            <ul class="flex gap-5 w-full">
                                @for (tech of projectSelected.technologies; track $index) {
                                    <li class="w-11 h-11 cursor-pointer hover:w-12 hover:h-12" [title]="tech.title">
                                        <img [src]="tech.logo" class="w-full h-full object-cover object-center">
                                    </li>
                                }
                            </ul>
                            <a 
                            [href]="projectSelected.repos"
                            class="text-xl w-1/4 text-white font-bold gap-1
                            max-md:text-right
                            max-md:w-full">
                                git repos
                                <i class="fa-solid fa-arrow-right m-1"></i>
                            </a>
                        </div>
                </div>
            </div>
        }
    </div>
